name: AUTU-LIO - Lấy SHA-1 khóa ký Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/get-release-sha1.yml'

permissions:
  contents: read

jobs:
  fingerprint:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Read public certificate fingerprints
        shell: bash
        env:
          AUTU_LIO_RELEASE_KEYSTORE_BASE64 (shared secret AILIO_KEYSTORE_BASE64): ${{ secrets.AILIO_KEYSTORE_BASE64 }}
          AUTU_LIO_RELEASE_STORE_PASSWORD (shared secret AILIO_KEYSTORE_PASSWORD): ${{ secrets.AILIO_KEYSTORE_PASSWORD }}
          AUTU_LIO_RELEASE_KEY_ALIAS (shared secret AILIO_KEY_ALIAS): ${{ secrets.AILIO_KEY_ALIAS }}
          AUTU_LIO_RELEASE_KEY_PASSWORD (shared secret AILIO_KEY_PASSWORD): ${{ secrets.AILIO_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          set +x

          for name in \
            AUTU_LIO_RELEASE_KEYSTORE_BASE64 (shared secret AILIO_KEYSTORE_BASE64) \
            AUTU_LIO_RELEASE_STORE_PASSWORD (shared secret AILIO_KEYSTORE_PASSWORD) \
            AUTU_LIO_RELEASE_KEY_ALIAS (shared secret AILIO_KEY_ALIAS) \
            AUTU_LIO_RELEASE_KEY_PASSWORD (shared secret AILIO_KEY_PASSWORD); do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing required GitHub Actions secret: $name"
              exit 1
            fi
          done

          KEYSTORE_PATH="$RUNNER_TEMP/autu-lio-release.p12"
          INFO_PATH="$RUNNER_TEMP/autu-lio-certificate-info.txt"
          trap 'rm -f "$KEYSTORE_PATH" "$INFO_PATH"' EXIT

          printf '%s' "$AUTU_LIO_RELEASE_KEYSTORE_BASE64 (shared secret AILIO_KEYSTORE_BASE64)" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"

          keytool -list -v \
            -keystore "$KEYSTORE_PATH" \
            -storetype PKCS12 \
            -storepass "$AUTU_LIO_RELEASE_STORE_PASSWORD (shared secret AILIO_KEYSTORE_PASSWORD)" \
            -alias "$AUTU_LIO_RELEASE_KEY_ALIAS (shared secret AILIO_KEY_ALIAS)" > "$INFO_PATH"

          SHA1="$(awk 'tolower($1) == "sha1:" {print $2; exit}' "$INFO_PATH")"
          SHA256="$(awk 'tolower($1) == "sha256:" {print $2; exit}' "$INFO_PATH")"

          if [[ -z "$SHA1" ]]; then
            echo "::error::Could not read the SHA-1 certificate fingerprint. Check that the configured keystore and alias are correct."
            exit 1
          fi

          {
            echo "## AUTU-LIO Release signing certificate"
            echo
            printf -- "- SHA-1: %s\\n" "$SHA1"
            if [[ -n "$SHA256" ]]; then
              printf -- "- SHA-256: %s\\n" "$SHA256"
            fi
            echo
            echo "Only public certificate fingerprints are reported. Private signing material is not printed or uploaded."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "SHA-1 certificate fingerprint:"
          echo "$SHA1"
