name: AUTU-LIO Cloudflare deploy

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/worker-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: autu-lio-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Kiểm tra, cập nhật D1 và triển khai Worker
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package.json

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install backend and Wrangler dependencies
        run: npm install --no-audit --no-fund

      - name: Validate Worker source and D1 migrations locally
        run: npm run check

      - name: Check Cloudflare deployment credentials
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || {
            echo "::error::Thiếu GitHub Secret CLOUDFLARE_API_TOKEN."
            exit 1
          }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || {
            echo "::error::Thiếu GitHub Secret CLOUDFLARE_ACCOUNT_ID."
            exit 1
          }

      - name: Apply pending production D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run migrate:remote

      - name: Deploy AUTU-LIO Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy

      - name: Deploy AUTU-LIO public website
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy:website

      - name: Verify published terms and privacy pages
        shell: bash
        run: |
          set -euo pipefail
          terms_file="$(mktemp)"
          privacy_file="$(mktemp)"
          trap 'rm -f "$terms_file" "$privacy_file"' EXIT
          curl --fail --silent --show-error --retry 5 --retry-delay 3 --retry-all-errors \
            --output "$terms_file" https://autu-lio.coc-lio-data.workers.dev/terms/
          curl --fail --silent --show-error --retry 5 --retry-delay 3 --retry-all-errors \
            --output "$privacy_file" https://autu-lio.coc-lio-data.workers.dev/privacy/
          grep -qi "Nghiên cứu, phát triển và kiểm thử bảo mật" "$terms_file"
          grep -qi "Nghiên cứu, chẩn đoán và xử lý lỗi bảo mật" "$privacy_file"
          echo "AUTU-LIO terms and privacy pages verified."
