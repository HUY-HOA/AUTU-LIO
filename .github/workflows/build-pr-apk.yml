name: Verify AUTU-LIO updater PR without release secrets

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: autu-lio-pr-verify-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout PR source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      - name: Install Android 37 SDK
        run: |
          sdkmanager --channel=3 "platforms;android-37.0" "build-tools;37.0.0"
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
        with:
          gradle-version: "9.6.0"

      - name: Run Kotlin/compiler checks and unit tests without APK packaging
        run: gradle --no-daemon --build-cache --parallel --console=plain :app:testDebugUnitTest :app:lintRelease
