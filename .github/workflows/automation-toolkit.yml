name: Manual automation toolkit

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Select browser testing or Android emulator testing
        required: true
        type: choice
        options: [browser, android]
        default: browser
      target_url:
        description: Public http(s) URL to test in browser mode
        required: false
        type: string
      browser_engine:
        description: Browser engine for browser mode
        required: true
        type: choice
        options: [both, playwright, selenium]
        default: both
      apk_url:
        description: Direct public HTTPS URL to an already-built APK in Android mode
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: manual-automation-toolkit-\${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    if: \${{ inputs.mode == 'browser' && (inputs.browser_engine == 'both' || inputs.browser_engine == 'playwright') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          python -m pip install "playwright==1.65.2"
          python -m playwright install --with-deps chromium
      - name: Run Playwright smoke test
        env:
          TARGET_URL: \${{ inputs.target_url }}
        run: |
          test -n "$TARGET_URL" || { echo "Provide target_url."; exit 2; }
          python .github/automation/browser_smoke.py playwright "$TARGET_URL" artifacts/playwright.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-smoke-playwright
          path: artifacts/playwright.png
          if-no-files-found: ignore
          retention-days: 7

  selenium:
    if: \${{ inputs.mode == 'browser' && (inputs.browser_engine == 'both' || inputs.browser_engine == 'selenium') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: browser-actions/setup-chrome@v1
      - name: Install Selenium
        run: python -m pip install "selenium==4.54.0"
      - name: Run Selenium smoke test
        env:
          TARGET_URL: \${{ inputs.target_url }}
        run: |
          test -n "$TARGET_URL" || { echo "Provide target_url."; exit 2; }
          python .github/automation/browser_smoke.py selenium "$TARGET_URL" artifacts/selenium.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-smoke-selenium
          path: artifacts/selenium.png
          if-no-files-found: ignore
          retention-days: 7

  appium:
    if: \${{ inputs.mode == 'android' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: "platform-tools"
      - name: Install Appium and UiAutomator2
        run: |
          npm install --global appium@latest
          appium driver install uiautomator2
          python -m pip install --upgrade pip
          python -m pip install "Appium-Python-Client==6.1.8"
      - name: Install APK and run Appium smoke test
        uses: ReactiveCircus/android-emulator-runner@v2.38.0
        env:
          APK_URL: \${{ inputs.apk_url }}
          APP_PACKAGE: "com.autu.lio"
          APP_ACTIVITY: "com.autu.lio.MainActivity"
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 600
          script: |
            set -euo pipefail
            case "$APK_URL" in
              https://*) ;;
              *) echo "Provide a direct public HTTPS apk_url. This workflow does not build APKs."; exit 2 ;;
            esac
            mkdir -p artifacts
            APK_PATH="$RUNNER_TEMP/lio-app.apk"
            curl --fail --location --retry 2 --connect-timeout 20 --max-time 180 "$APK_URL" --output "$APK_PATH"
            unzip -tq "$APK_PATH"
            adb wait-for-device
            adb install -r "$APK_PATH"
            appium --address 127.0.0.1 --port 4723 --log "$RUNNER_TEMP/appium.log" >/dev/null 2>&1 &
            APPIUM_PID=$!
            for attempt in $(seq 1 90); do
              if curl --fail --silent http://127.0.0.1:4723/status >/dev/null; then break; fi
              sleep 2
            done
            if ! curl --fail --silent http://127.0.0.1:4723/status >/dev/null; then
              cat "$RUNNER_TEMP/appium.log"
              kill "$APPIUM_PID" || true
              exit 1
            fi
            python .github/automation/appium_smoke.py --package "$APP_PACKAGE" --activity "$APP_ACTIVITY" --screenshot artifacts/appium-smoke.png
            kill "$APPIUM_PID" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: appium-android-smoke
          path: artifacts/appium-smoke.png
          if-no-files-found: ignore
          retention-days: 7
