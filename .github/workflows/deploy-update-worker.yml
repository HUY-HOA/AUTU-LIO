name: Deploy AUTU-LIO APK update Worker

on:
  push:
    branches: [main]
    paths:
      - "cloudflare/update-worker.js"
      - "cloudflare/wrangler.update.jsonc"
      - ".github/workflows/deploy-update-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: autu-lio-apk-update-worker-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    name: Deploy and verify AUTU-LIO update Worker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate Cloudflare credentials
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: \${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: \${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          # A leading backslash was accidentally included when these existing
          # GitHub secrets were originally pasted. Normalize in-memory only.
          CLOUDFLARE_API_TOKEN="\${CLOUDFLARE_API_TOKEN#\\\\}"
          CLOUDFLARE_ACCOUNT_ID="\${CLOUDFLARE_ACCOUNT_ID#\\\\}"
          export CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID
          test -n "$CLOUDFLARE_API_TOKEN" || {
            echo "::error::Missing CLOUDFLARE_API_TOKEN."
            exit 1
          }
          [[ "$CLOUDFLARE_ACCOUNT_ID" =~ ^[a-fA-F0-9]{32}$ ]] || {
            echo "::error::CLOUDFLARE_ACCOUNT_ID is invalid after removing the accidental leading backslash."
            exit 1
          }
          cp cloudflare/update-worker.js "$RUNNER_TEMP/update-worker.mjs"
          node --check "$RUNNER_TEMP/update-worker.mjs"
          node -e 'const fs=require("fs"); const c=JSON.parse(fs.readFileSync("cloudflare/wrangler.update.jsonc","utf8")); if(c.name!=="autu-lio-updates"||c.main!=="update-worker.js"||c.workers_dev!==true) process.exit(1);'

      - name: Deploy AUTU-LIO update Worker
        env:
          CLOUDFLARE_API_TOKEN: \${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: \${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          export CLOUDFLARE_API_TOKEN="\${CLOUDFLARE_API_TOKEN#\\\\}"
          export CLOUDFLARE_ACCOUNT_ID="\${CLOUDFLARE_ACCOUNT_ID#\\\\}"
          npx --yes wrangler@4 deploy --config cloudflare/wrangler.update.jsonc

      - name: Verify deployed updater endpoints
        shell: bash
        run: |
          set -euo pipefail
          base="https://autu-lio-updates.coc-lio-data.workers.dev"
          curl --retry 5 --retry-delay 3 --retry-all-errors --fail --silent --show-error "$base/health" \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d.get("ok") is True and d.get("appId")=="autu-lio" and d.get("delta")=="lio-delta-v1"; print("AUTU-LIO updater Worker health verified.")'
          manifest="$(mktemp)"
          trap 'rm -f "$manifest"' EXIT
          curl --retry 5 --retry-delay 3 --retry-all-errors --fail --silent --show-error "$base/v1/latest" -o "$manifest"
          python3 - "$manifest" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          assert d.get("appId")=="autu-lio"
          assert d.get("applicationId")=="com.autu.lio"
          assert d.get("downloadUrl","").startswith("https://autu-lio-updates.coc-lio-data.workers.dev/v1/download/")
          assert len(d.get("sha256") or "")==64
          print("AUTU-LIO release manifest verified.")
          PY
