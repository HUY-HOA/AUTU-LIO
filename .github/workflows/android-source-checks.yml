name: AUTU-LIO Android source checks

on:
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - ".github/workflows/android-source-checks.yml"
      - ".github/workflows/build-apks.yml"
  push:
    branches: [main]
    paths:
      - "app/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - ".github/workflows/android-source-checks.yml"
      - ".github/workflows/build-apks.yml"

permissions:
  contents: read

concurrency:
  group: autu-lio-android-source-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compile-kotlin:
    name: Compile Android Kotlin sources (no APK packaging)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      - name: Install Android 37 SDK
        run: |
          sdkmanager --channel=3 "platforms;android-37.0" "build-tools;37.0.0"
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
        with:
          gradle-version: "9.6.0"

      - name: Verify Maven repositories
        run: |
          set -e
          urls=(
            "https://repo.maven.apache.org/maven2/org/jetbrains/kotlin/kotlin-gradle-plugin/2.4.21/kotlin-gradle-plugin-2.4.21.pom"
            "https://repo.maven.apache.org/maven2/org/jetbrains/kotlin/kotlin-stdlib/2.4.21/kotlin-stdlib-2.4.21.pom"
            "https://repo.maven.apache.org/maven2/org/ow2/asm/asm/9.9/asm-9.9.pom"
            "https://dl.google.com/dl/android/maven2/com/android/tools/build/gradle/9.3.1/gradle-9.3.1.pom"
          )
          for url in "${urls[@]}"; do
            curl --fail --silent --show-error --location --output /dev/null --write-out "%{http_code} %{url_effective}\n" "$url"
          done

      - name: Compile sources and run script compiler unit tests without APK packaging
        run: gradle --no-daemon --build-cache --parallel --console=plain :app:testDebugUnitTest :app:lintRelease
