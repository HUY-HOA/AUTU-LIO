name: Apply in-app APK updater integration
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/app-update-bootstrap.yml"
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Integrate updater safely
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          app = "AUTU-LIO"
          manifest = Path("app/src/main/AndroidManifest.xml")
          text = manifest.read_text()
          permission = '    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />'
          if permission not in text:
              anchor = '    <uses-permission android:name="android.permission.INTERNET" />'
              if anchor not in text:
                  raise SystemExit("INTERNET permission anchor missing")
              text = text.replace(anchor, anchor + "\\n" + permission, 1)
              manifest.write_text(text)

          updater = Path("app/src/main/java/com/autulio/app/AppUpdateManager.kt")
          text = updater.read_text()
          # Render real line breaks in update dialogs, not the two literal characters \\ and n.
          text = text.replace('append("\\\\nPhiên bản mới:', 'append("\\nPhiên bản mới:')
          text = text.replace('append("\\\\n\\\\n").append(notes)', 'append("\\n\\n").append(notes)')
          updater.write_text(text)


          print("Integrated app updater for", app)
          PY
      - name: Commit updater integration
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/AndroidManifest.xml app/src/main/java
          git commit -m "Wire independent in-app APK updates"
          git push origin HEAD:main
