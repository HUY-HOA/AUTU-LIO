name: Apply in-app APK updater integration
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/app-update-bootstrap.yml"
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Integrate updater safely
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          app = "AUTU-LIO"
          manifest = Path("app/src/main/AndroidManifest.xml")
          text = manifest.read_text()
          permission = '    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />'
          if permission not in text:
              anchor = '    <uses-permission android:name="android.permission.INTERNET" />'
              if anchor not in text:
                  raise SystemExit("INTERNET permission anchor missing")
              text = text.replace(anchor, anchor + "\\n" + permission, 1)
              manifest.write_text(text)

          updater = Path("app/src/main/java/com/autulio/app/AppUpdateManager.kt")
          text = updater.read_text()
          # Render real line breaks in update dialogs, not the two literal characters \\ and n.
          text = text.replace('append("\\\\nPhiên bản mới:', 'append("\\nPhiên bản mới:')
          text = text.replace('append("\\\\n\\\\n").append(notes)', 'append("\\n\\n").append(notes)')
          updater.write_text(text)

          if app == "GPS-LIO":
              p = Path("app/src/main/java/com/autulio/app/MainActivity.kt")
              text = p.read_text()
              marker = """        setContent {
                      GpsLioApp()
                  }
              }
          }"""
              replacement = """        setContent {
                      GpsLioApp()
                  }
                  window.decorView.postDelayed({ AppUpdateManager.check(this) }, 2_500L)
              }

              override fun onResume() {
                  super.onResume()
                  AppUpdateManager.resume(this)
              }
          }"""
              if marker in text:
                  text = text.replace(marker, replacement, 1)
              elif "AppUpdateManager.check(this)" not in text:
                  raise SystemExit("GPS MainActivity integration anchor missing")
              p.write_text(text)

          elif app == "AUTU-LIO":
              p = Path("app/src/main/java/com/autulio/app/MainActivity.kt")
              text = p.read_text()
              marker = """class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  prepareDisplayGeometryCapture()
                  setContent {
                      AutuLioAppEntry()
                  }
              }"""
              replacement = """class MainActivity : ComponentActivity() {
              override fun onResume() {
                  super.onResume()
                  AppUpdateManager.resume(this)
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  prepareDisplayGeometryCapture()
                  setContent {
                      AutuLioAppEntry()
                  }
                  window.decorView.postDelayed({ AppUpdateManager.check(this) }, 2_500L)
              }"""
              if marker in text:
                  text = text.replace(marker, replacement, 1)
              elif "AppUpdateManager.check(this)" not in text:
                  raise SystemExit("AUTU MainActivity integration anchor missing")
              p.write_text(text)

          elif app == "COC-LIO":
              p = Path("app/src/main/java/com/autulio/app/MainActivity.kt")
              p.write_text("""package com.huyhoa.coclio

          import android.app.Activity
          import android.app.Application
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper

          class CocLioApplication : Application() {
              private var updateCheckScheduled = false
              private val handler = Handler(Looper.getMainLooper())

              override fun onCreate() {
                  super.onCreate()
                  registerActivityLifecycleCallbacks(object : ActivityLifecycleCallbacks {
                      override fun onActivityCreated(activity: Activity, state: Bundle?) = Unit
                      override fun onActivityStarted(activity: Activity) = Unit
                      override fun onActivityResumed(activity: Activity) {
                          if (activity !is MainActivity) return
                          AppUpdateManager.resume(activity)
                          if (!updateCheckScheduled) {
                              updateCheckScheduled = true
                              handler.postDelayed({
                                  if (!activity.isFinishing && !activity.isDestroyed) AppUpdateManager.check(activity)
                              }, 2_500L)
                          }
                      }
                      override fun onActivityPaused(activity: Activity) = Unit
                      override fun onActivityStopped(activity: Activity) = Unit
                      override fun onActivitySaveInstanceState(activity: Activity, outState: Bundle) = Unit
                      override fun onActivityDestroyed(activity: Activity) = Unit
                  })
              }
          }
          """)

          print("Integrated app updater for", app)
          PY
      - name: Commit updater integration
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/AndroidManifest.xml app/src/main/java
          git commit -m "Wire independent in-app APK updates"
          git push origin HEAD:main
