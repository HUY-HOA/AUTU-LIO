# Explicit owner build trigger: BUILD APK
# Build request: publish the updated AUTU-LIO updater-enabled release APK.
# Owner-requested build confirmation: 2026-11-24.
name: AUTU-LIO Android APK

run-name: AUTU-LIO Release APK - ${{ github.ref_name }}

on:
  push:
    branches:
      - main
 
permissions:
  contents: read

concurrency:
  group: autu-lio-apk-build
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: write
      id-token: write
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && github.event.head_commit.message == 'BUILD APK'
    name: Build one AUTU-LIO APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      - name: Install Android 37 SDK
        run: |
          sdkmanager --channel=3 "platforms;android-37.0" "build-tools;37.0.0"
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
        with:
          gradle-version: "9.6.0"

      - name: Prepare Android signing
        id: signing
        shell: bash
        env:
          REQUESTED_BUILD_VARIANT: release
          AUTU_LIO_RELEASE_KEYSTORE_BASE64: ${{ secrets.AILIO_KEYSTORE_BASE64 }}
          AUTU_LIO_RELEASE_STORE_PASSWORD: ${{ secrets.AILIO_KEYSTORE_PASSWORD }}
          AUTU_LIO_RELEASE_KEY_ALIAS: ${{ secrets.AILIO_KEY_ALIAS }}
          AUTU_LIO_RELEASE_KEY_PASSWORD: ${{ secrets.AILIO_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          values=(
            "$AUTU_LIO_RELEASE_KEYSTORE_BASE64"
            "$AUTU_LIO_RELEASE_STORE_PASSWORD"
            "$AUTU_LIO_RELEASE_KEY_ALIAS"
            "$AUTU_LIO_RELEASE_KEY_PASSWORD"
          )
          present=0
          for value in "${values[@]}"; do
            if [[ -n "$value" ]]; then present=$((present + 1)); fi
          done

          if [[ "$REQUESTED_BUILD_VARIANT" == "debug" ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "variant=debug" >> "$GITHUB_OUTPUT"
            echo "artifact_name=AUTU-LIO-Debug" >> "$GITHUB_OUTPUT"
            echo "Debug test APK selected. Release signing secrets are not used."
            exit 0
          fi

          if [[ -n "$REQUESTED_BUILD_VARIANT" && "$REQUESTED_BUILD_VARIANT" != "release" ]]; then
            echo "::error::Unknown build variant: $REQUESTED_BUILD_VARIANT"
            exit 1
          fi

          if [[ "$present" -eq 0 ]]; then
            if [[ "$REQUESTED_BUILD_VARIANT" == "release" ]]; then
              echo "::error::Release signing secrets are not configured. Refusing to create an unsigned or Debug APK for a production Release request."
              exit 1
            fi
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "variant=debug" >> "$GITHUB_OUTPUT"
            echo "artifact_name=AUTU-LIO-Debug" >> "$GITHUB_OUTPUT"
            echo "::warning::Debug APK selected explicitly. This artifact is not for customer release or stable updates."
            exit 0
          fi

          if [[ "$present" -ne 4 ]]; then
            echo "::error::Signing setup is incomplete. Configure all four shared AILIO_* repository secrets or remove all four."
            exit 1
          fi

          KEYSTORE_PATH="$RUNNER_TEMP/autu-lio-release.p12"
          printf '%s' "$AUTU_LIO_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$AUTU_LIO_RELEASE_STORE_PASSWORD" -alias "$AUTU_LIO_RELEASE_KEY_ALIAS" >/dev/null

          echo "configured=true" >> "$GITHUB_OUTPUT"
          echo "variant=release" >> "$GITHUB_OUTPUT"
          echo "artifact_name=AUTU-LIO-Release" >> "$GITHUB_OUTPUT"
          echo "keystore_path=$KEYSTORE_PATH" >> "$GITHUB_OUTPUT"

      - name: Write build summary
        env:
          APK_VARIANT: ${{ steps.signing.outputs.variant }}
        run: |
          {
            echo "## AUTU-LIO APK build"
            printf -- '- Source branch: `%s`\n' "$GITHUB_REF_NAME"
            echo "- App version: AUTU-LIO v0.1.$GITHUB_RUN_NUMBER"
            if [[ "$APK_VARIANT" == "release" ]]; then
              echo "- Output: R8-minified, resource-shrunk, release-signed APK"
            else
              echo "- Output: Debug test APK; not suitable for stable customer updates"
            fi
            echo "- Progress is shown by completed GitHub Actions steps; Gradle does not provide a reliable overall percentage."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Validate and build signed Release APK
        if: steps.signing.outputs.configured == 'true'
        timeout-minutes: 30
        env:
          AUTU_LIO_RELEASE_KEYSTORE_PATH: ${{ steps.signing.outputs.keystore_path }}
          AUTU_LIO_RELEASE_STORE_PASSWORD: ${{ secrets.AILIO_KEYSTORE_PASSWORD }}
          AUTU_LIO_RELEASE_KEY_ALIAS: ${{ secrets.AILIO_KEY_ALIAS }}
          AUTU_LIO_RELEASE_KEY_PASSWORD: ${{ secrets.AILIO_KEY_PASSWORD }}
        run: gradle --no-daemon --build-cache --parallel --console=plain :app:lintRelease :app:assembleRelease -PAUTU_LIO_VERSION_CODE=${{ github.run_number }} -PAUTU_LIO_VERSION_NAME=0.1.${{ github.run_number }}

      - name: Validate and build Debug test APK
        if: steps.signing.outputs.configured != 'true'
        timeout-minutes: 30
        run: gradle --no-daemon --build-cache --parallel --console=plain :app:lintDebug :app:assembleDebug -PAUTU_LIO_VERSION_CODE=${{ github.run_number }} -PAUTU_LIO_VERSION_NAME=0.1.${{ github.run_number }}

      - name: Name AUTU-LIO APK with version
        env:
          APK_VARIANT: ${{ steps.signing.outputs.variant }}
        run: |
          set -euo pipefail
          APK_DIR="app/build/outputs/apk/$APK_VARIANT"
          VERSION_NAME="0.1.$GITHUB_RUN_NUMBER"
          shopt -s nullglob
          apks=("$APK_DIR"/*.apk)
          if [[ "${#apks[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one APK to rename, found ${#apks[@]}."
            exit 1
          fi
          mv "${apks[0]}" "$APK_DIR/AUTU-LIO-v$VERSION_NAME.apk"

      - name: Verify APK signature and output
        env:
          APK_VARIANT: ${{ steps.signing.outputs.variant }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(app/build/outputs/apk/"$APK_VARIANT"/*.apk)
          if [[ "${#apks[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one APK, found ${#apks[@]}."
            exit 1
          fi
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose --print-certs "${apks[0]}"
          sha256sum "${apks[0]}" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Remove temporary signing key
        if: always() && steps.signing.outputs.keystore_path != ''
        env:
          KEYSTORE_PATH: ${{ steps.signing.outputs.keystore_path }}
        run: rm -f "$KEYSTORE_PATH"

      - name: Upload AUTU-LIO APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.signing.outputs.artifact_name }}
          path: app/build/outputs/apk/${{ steps.signing.outputs.variant }}/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish signed Release APK to GitHub Releases
        if: steps.signing.outputs.variant == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: 0.1.${{ github.run_number }}
        run: |
          set -euo pipefail
          APK_PATH="app/build/outputs/apk/release/AUTU-LIO-v${VERSION_NAME}.apk"
          test -s "$APK_PATH"
          gh release create "v${VERSION_NAME}" "$APK_PATH#AUTU-LIO.apk" \
            --target "$GITHUB_SHA" \
            --title "AUTU-LIO v${VERSION_NAME}" \
            --notes "Bản phát hành AUTU-LIO Android. Chỉ cài đặt APK từ bản phát hành chính thức này. Xem thay đổi tại commit ${GITHUB_SHA}."

      - name: Check published release for FCM
        id: fcm_release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: "v$VERSION_NAME"
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --json tagName >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "Release $RELEASE_TAG exists; checking FCM notification."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Release $RELEASE_TAG was not created; Apps Script fallback remains available."
          fi

      - name: Authenticate to Google Cloud with Workload Identity Federation
        id: google_auth
        if: steps.fcm_release.outputs.published == 'true'
        continue-on-error: true
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: coc-lio-73de9
          workload_identity_provider: projects/854984158580/locations/global/workloadIdentityPools/lio-github-pool/providers/github-lio
          service_account: lio-fcm-sender@coc-lio-73de9.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/firebase.messaging

      - name: Send release notification through FCM (WIF primary)
        id: fcm_wif_send
        if: steps.fcm_release.outputs.published == 'true' && steps.google_auth.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ACCESS_TOKEN: ${{ steps.google_auth.outputs.access_token }}
          RELEASE_TAG: "v$VERSION_NAME"
          VERSION_NAME: "$VERSION_NAME"
          APP_NAME: "AUTU-LIO"
          FIREBASE_PROJECT_ID: "autu-lio-515207"
          CURRENT_TOPIC: "autu-lio-announcements"
          LEGACY_TOPIC: "autu-lio-update-notices"
        shell: bash
        run: |
          set -euo pipefail
          MARKER="<!-- LIO_FCM_WIF_SENT -->"
          NOTES="$(gh release view "$RELEASE_TAG" --json body --jq .body)"
          if [[ "$NOTES" == *"$MARKER"* ]]; then
            echo "FCM success marker already exists; not sending a duplicate."
            exit 0
          fi

          TITLE="$APP_NAME có bản cập nhật mới"
          BODY="Phiên bản $VERSION_NAME đã sẵn sàng. Mở $APP_NAME để kiểm tra cập nhật."

          send_topic() {
            local topic="$1"
            local response_file
            response_file="$(mktemp)"
            local http_code
            http_code="$(curl --silent --show-error --output "$response_file" --write-out '%{http_code}' \
              -X POST "https://fcm.googleapis.com/v1/projects/$FIREBASE_PROJECT_ID/messages:send" \
              -H "Authorization: Bearer $ACCESS_TOKEN" \
              -H "Content-Type: application/json" \
              --data "$(jq -n \
                --arg topic "$topic" \
                --arg title "$TITLE" \
                --arg body "$BODY" \
                --arg appId "autu-lio" \
                --arg tag "$RELEASE_TAG" \
                --arg version "$VERSION_NAME" \
                '{message:{topic:$topic,notification:{title:$title,body:$body},data:{type:"app_update",title:$title,body:$body,appId:$appId,event:"app_update",releaseTag:$tag,versionName:$version},android:{priority:"HIGH"}}}')"
            )"
            if [[ "$http_code" -lt 200 || "$http_code" -ge 300 ]] || ! jq -e '.name' "$response_file" >/dev/null 2>&1; then
              echo "::error::FCM failed for $APP_NAME topic $topic (HTTP $http_code):"
              cat "$response_file"
              rm -f "$response_file"
              return 1
            fi
            echo "FCM accepted: $APP_NAME topic $topic"
            rm -f "$response_file"
          }

          # Send to legacy and current topics for compatibility with existing APKs.
          send_topic "$LEGACY_TOPIC"
          send_topic "$CURRENT_TOPIC"

          # Mark the GitHub Release only after FCM accepts both topic messages.
          UPDATED_NOTES="${NOTES}"$'\n\n'"$MARKER"
          for attempt in 1 2 3; do
            if gh release edit "$RELEASE_TAG" --notes "$UPDATED_NOTES"; then
              echo "Release marked as FCM-sent by WIF."
              exit 0
            fi
            echo "::warning::Could not save the FCM marker on attempt $attempt."
            sleep 2
          done
          echo "::error::FCM accepted the notification but the Release marker could not be saved; Apps Script fallback may send a duplicate."
          exit 1

      - name: Report notification fallback status
        if: steps.fcm_release.outputs.published == 'true' && steps.google_auth.outcome != 'success'
        shell: bash
        run: echo "::warning::WIF authentication unavailable. Apps Script backup will send this release after its grace period."

# Owner-requested BUILD APK trigger: 2026-11-24.
