name: AUTU-LIO Android APK

run-name: AUTU-LIO APK build - ${{ github.ref_name }}

on:
  workflow_dispatch:
  push:
    branches:
      - 'build-requests/**'
    paths:
      - '.build-requests/**'

permissions:
  contents: read

concurrency:
  group: autu-lio-apk-build
  cancel-in-progress: false

jobs:
  build:
    name: Build Admin and Client APKs
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      - name: Install Android 37 SDK
        run: sdkmanager "platforms;android-37" "build-tools;36.0.0"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.0"

      - name: Write build summary
        run: |
          {
            echo "## AUTU-LIO APK build"
            echo "- Source branch: \`$GITHUB_REF_NAME\`"
            echo "- Variants: Admin Debug and Client Debug"
            echo "- Progress is shown by completed GitHub Actions steps; Gradle does not provide a reliable overall percentage."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify toolchain
        run: |
          java -version
          gradle --version
          sdkmanager --list_installed

      - name: Run Android checks
        run: gradle --no-daemon :app:lintAdminDebug :app:lintClientDebug

      - name: Build both APK variants
        run: gradle --no-daemon :app:assembleAdminDebug :app:assembleClientDebug

      - name: Upload Admin APK
        uses: actions/upload-artifact@v4
        with:
          name: AUTU-LIO-Admin-Debug
          path: app/build/outputs/apk/admin/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Client APK
        uses: actions/upload-artifact@v4
        with:
          name: AUTU-LIO-AutoClick-Debug
          path: app/build/outputs/apk/client/debug/*.apk
          if-no-files-found: error
          retention-days: 14
