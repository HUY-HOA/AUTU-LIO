name: AUTU-LIO Android APK

run-name: AUTU-LIO single APK build - ${{ github.ref_name }}

on:
  workflow_dispatch:
  push:
    branches:
      - 'build-requests/**'
    paths:
      - '.build-requests/**'

permissions:
  contents: read

concurrency:
  group: autu-lio-apk-build
  cancel-in-progress: false

jobs:
  build:
    name: Build one AUTU-LIO APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      - name: Install Android 37 SDK
        run: |
          sdkmanager --channel=3 "platforms;android-37.0" "build-tools;37.0.0"
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.0"

      - name: Write build summary
        run: |
          {
            echo "## AUTU-LIO APK build"
            echo "- Source branch: \`$GITHUB_REF_NAME\`"
            echo "- Output: one AUTU-LIO Debug APK with role-based screens"
            echo "- Progress is shown by completed GitHub Actions steps; Gradle does not provide a reliable overall percentage."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify toolchain
        run: |
          java -version
          gradle --version
          sdkmanager --list_installed

      - name: Run Android checks
        run: gradle --no-daemon :app:lintDebug

      - name: Build one APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload AUTU-LIO APK
        uses: actions/upload-artifact@v4
        with:
          name: AUTU-LIO-Debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
