name: Validate LIO differential APK updates

on:
  pull_request:
    branches: [main]
    paths:
      - "cloudflare/update-worker.js"
      - "tools/create_lio_delta.py"
      - ".github/workflows/delta-update-checks.yml"
  push:
    branches: [main]
    paths:
      - "cloudflare/update-worker.js"
      - "tools/create_lio_delta.py"
      - ".github/workflows/delta-update-checks.yml"

permissions:
  contents: read

jobs:
  validate-delta:
    name: Validate Worker syntax and delta round-trip
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Cloudflare Worker JavaScript syntax
        run: cp cloudflare/update-worker.js "$RUNNER_TEMP/update-worker.mjs" && node --check "$RUNNER_TEMP/update-worker.mjs"

      - name: Verify patch generator syntax and binary reconstruction
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/create_lio_delta.py
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          python3 - "$tmp" <<'PY'
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          source = bytearray((i * 37 + (i >> 4)) % 256 for i in range(180_000))
          target = source[:]
          target[22_000:25_000] = b"changed-section-" * 180
          target[92_000:92_900] = b""
          target[135_000:135_000] = b"inserted-data-" * 700
          (root / "old.apk").write_bytes(source)
          (root / "new.apk").write_bytes(target)
          PY
          python3 tools/create_lio_delta.py \
            --from-apk "$tmp/old.apk" \
            --to-apk "$tmp/new.apk" \
            --output "$tmp/update.lio.gz"
          test -s "$tmp/update.lio.gz"
          echo "Delta generator self-reconstruction and SHA-256 validation passed."
