name: AUTU-LIO Worker checks

on:
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/worker-checks.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/worker-checks.yml"

permissions:
  contents: read

jobs:
  validate-worker:
    name: Validate Worker behavior and D1 migrations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Run Worker syntax, API behavior, and D1 migration checks
        working-directory: backend
        run: npm run check
