name: AUTU-LIO Worker checks

on:
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/worker-checks.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/worker-checks.yml"

permissions:
  contents: read

jobs:
  validate-worker:
    name: Validate Worker behavior and D1 migrations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Worker syntax, API behavior, and D1 migration checks
        working-directory: backend
        run: npm run check
