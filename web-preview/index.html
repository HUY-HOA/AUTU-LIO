<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<meta name="description" content="Bản Web đối chiếu giao diện AUTU-LIO Android từ mã nguồn hiện tại.">
<title>AUTU-LIO · Android UI Mirror</title>
<style>
:root{color-scheme:dark;--bg:#0b1220;--surface:#131e2e;--surface2:#18283b;--line:#293b52;--text:#edf4ff;--muted:#91a3ba;--blue:#4f8cff;--teal:#35c6c8;--green:#53c89a;--amber:#e8b65d;--red:#ee7883;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -20%,rgba(79,140,255,.16),transparent 48%),var(--bg);color:var(--text)}button,input,textarea,select{font:inherit}button{cursor:pointer;color:inherit}.hidden{display:none!important}
.app-frame{width:min(100%,760px);min-height:100vh;margin:0 auto;background:rgba(11,18,32,.72);border-left:1px solid rgba(41,59,82,.45);border-right:1px solid rgba(41,59,82,.45);display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:4;display:flex;align-items:center;gap:12px;min-height:66px;padding:12px 18px;background:rgba(11,18,32,.93);border-bottom:1px solid var(--line);backdrop-filter:blur(16px)}
.brand-mark{width:36px;height:36px;border-radius:12px;background:linear-gradient(145deg,#4f8cff,#35c6c8);display:grid;place-items:center;font-weight:900;color:white;box-shadow:0 6px 20px #4f8cff35;flex:none}
.brand-name{font-weight:800;letter-spacing:.08em}.brand-sub{display:block;color:var(--muted);font-size:9px;letter-spacing:.14em;margin-top:2px}
.top-title{min-width:0;flex:1}.top-title strong{font-size:14px}.top-title small{display:block;color:var(--muted);font-size:11px;margin-top:3px}
.icon-btn,.back-btn{border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:9px 12px;color:var(--text)}
.page{padding:20px 17px 30px;flex:1}.bottom-nav{position:sticky;bottom:0;z-index:3;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:2px;padding:8px max(8px,env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left));background:rgba(19,30,46,.97);border-top:1px solid var(--line);backdrop-filter:blur(12px)}
.nav-btn{border:0;background:transparent;color:var(--muted);border-radius:10px;padding:7px 3px;display:grid;justify-items:center;gap:4px;font-size:10px;min-width:0}
.nav-btn .nav-icon{font-size:18px;line-height:1.1}.nav-btn.active{color:#9fc2ff;background:#4f8cff18}
.eyebrow{color:#8da5c2;font-size:10px;font-weight:800;letter-spacing:.15em}.page-title{font-size:25px;line-height:1.2;margin:7px 0 7px}.page-sub{margin:0 0 18px;color:var(--muted);font-size:13px;line-height:1.5}
.card{background:linear-gradient(145deg,var(--surface),#111c2c);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}
.card h2,.card h3{margin:0 0 8px}.card p{margin:0;color:var(--muted);font-size:13px;line-height:1.5}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.pill{display:inline-flex;align-items:center;border:1px solid #36506e;border-radius:999px;padding:5px 9px;font-size:10px;color:#afc5e2;white-space:nowrap}
.pill.info{border-color:#315b91;color:#9fc2ff;background:#4f8cff12}.pill.warn{border-color:#725b32;color:#f1cb83;background:#e8b65d12}.pill.good{border-color:#286450;color:#77d7b0;background:#53c89a12}.pill.bad{border-color:#714047;color:#ff9ca5;background:#ee788312}
.status-note{border-left:3px solid var(--amber);background:#e8b65d10;padding:12px 13px;border-radius:9px;margin:12px 0;color:#e6d6b8;font-size:12px;line-height:1.5}
.status-note.blue{border-color:var(--blue);background:#4f8cff10;color:#c5d9f5}.status-note.green{border-color:var(--green);background:#53c89a10;color:#b8e7d3}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);border-radius:11px;padding:11px 14px;background:var(--surface2);color:var(--text);font-weight:650;font-size:13px}
.btn.primary{background:var(--blue);border-color:var(--blue);color:white}.btn.ghost{background:transparent}.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-row{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}.full{width:100%}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.metric{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:13px}.metric small{color:var(--muted);font-size:11px}.metric strong{display:block;font-size:23px;margin-top:6px}
.action-list{display:grid;gap:8px}.action-row{width:100%;display:flex;align-items:center;gap:12px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:13px}
.action-icon{width:34px;height:34px;border-radius:10px;background:#4f8cff18;color:#a9c7ff;display:grid;place-items:center;flex:none;font-size:17px}
.action-row strong{display:block;font-size:13px}.action-row small{display:block;color:var(--muted);font-size:11px;margin-top:3px}.action-arrow{margin-left:auto;color:var(--muted)}
.empty-state{text-align:center;padding:22px 15px}.empty-icon{width:48px;height:48px;border:1px solid var(--line);background:var(--surface2);border-radius:15px;display:grid;place-items:center;margin:0 auto 12px;font-size:22px}.empty-state strong{display:block;margin-bottom:5px}.empty-state p{color:var(--muted);font-size:12px;line-height:1.5}
.role-grid{display:grid;gap:10px;margin:18px 0}.role-card{display:flex;align-items:center;gap:13px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:15px;padding:15px;width:100%}.role-card:active{border-color:var(--blue);background:#4f8cff13}.role-card .action-icon{width:42px;height:42px;font-size:20px}.role-card strong{font-size:14px}.role-card small{display:block;color:var(--muted);font-size:11px;line-height:1.4;margin-top:4px}.role-card .action-arrow{font-size:20px}
.field{display:block;margin:12px 0}.field span{display:block;font-size:12px;color:var(--muted);margin:0 0 6px}.field input,.field textarea,.field select,.code-area{width:100%;border:1px solid var(--line);border-radius:11px;background:#0b1524;color:var(--text);padding:12px;outline:none}.field textarea,.code-area{min-height:190px;resize:vertical;font:12px/1.6 ui-monospace,SFMono-Regular,Consolas,monospace}
.template{padding:13px;background:var(--surface);border:1px solid var(--line);border-radius:12px;margin:8px 0}.template strong{display:block;font-size:13px}.template small{display:block;color:var(--muted);font-size:11px;margin-top:4px;line-height:1.4}
.color-row{display:flex;gap:9px;flex-wrap:wrap}.color-chip{border:1px solid var(--line);background:var(--surface2);border-radius:999px;padding:8px 13px;font-size:12px}
.footer-note{color:#71859e;font-size:10px;line-height:1.5;text-align:center;border-top:1px solid var(--line);padding:14px 16px calc(16px + env(safe-area-inset-bottom))}
.toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:#1b2a40;border:1px solid #39506c;padding:10px 14px;border-radius:11px;color:white;font-size:12px;z-index:10;box-shadow:0 10px 28px #0007;max-width:90vw}
.theme-light{--bg:#f4f7fb;--surface:#fff;--surface2:#f0f4fa;--line:#d7e0eb;--text:#172338;--muted:#64758b;background:var(--bg)}
.theme-light .app-frame{background:transparent}.theme-light .topbar{background:#f4f7fbee}.theme-light .bottom-nav{background:#ffffffef}.theme-light .field input,.theme-light .field textarea,.theme-light .code-area{background:#f7f9fc;color:#172338}
@media(min-width:720px){body{padding:20px 0}.app-frame{min-height:calc(100vh - 40px);border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:0 22px 80px #0005}.page{padding:24px 24px 34px}.topbar{padding:14px 24px}.bottom-nav{padding-bottom:12px}}
@media(max-width:430px){.page-title{font-size:23px}.page{padding:18px 14px 26px}.grid{gap:8px}.metric{padding:11px}.metric strong{font-size:21px}.topbar{padding:10px 13px}}
</style>
</head>
<body>
<div class="app-frame" id="app-frame">
<header class="topbar hidden" id="topbar">
<button class="back-btn hidden" id="back-to-roles" type="button">‹ Vai trò</button>
<div class="brand-mark">A</div>
<div class="top-title"><strong id="top-title">AUTU-LIO</strong><small id="top-subtitle">Bản xem trước giao diện Android</small></div>
<button class="icon-btn" id="theme-toggle" type="button" aria-label="Đổi giao diện">◐</button>
</header>
<main class="page" id="screen"></main>
<nav class="bottom-nav hidden" id="bottom-nav" aria-label="Điều hướng ứng dụng"></nav>
<footer class="footer-note" id="footer-note">Bản Web chỉ phản chiếu giao diện. Quyền Android, bộ nhớ Android Keystore và thao tác trên ứng dụng khác chỉ chạy trong APK.</footer>
</div>
<div class="toast hidden" id="toast" role="status"></div>
<script src="./app.js" defer></script>
</body>
</html>
